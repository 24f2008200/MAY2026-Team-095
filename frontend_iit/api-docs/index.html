<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Society API Docs — Team Sputnik</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; } /* hide default Swagger green bar */
    .team-banner {
      background: #1f2937;
      color: #fff;
      padding: 10px 24px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 14px;
    }
    .team-banner b { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="team-banner">
    <b>Smart Society Complaint Resolution System</b> — API Reference (Team Sputnik, MAY2026-Team-095)
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "./openapi.yaml",
        dom_id: "#swagger-ui",
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout",
        deepLinking: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 1
      });
    };
  </script>
</body>
</html>
