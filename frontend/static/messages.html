<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Society | Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" class="min-h-screen flex flex-col bg-slate-50">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex justify-between items-center">
                <div class="flex items-center cursor-pointer" @click="goHome()">
                    <div class="mr-3"><img src="../images/logo.svg" alt="Smart Society Logo" class="w-8 h-8 rounded-md shadow-sm" /></div>
                    <div><h1 class="font-extrabold text-lg text-slate-900 tracking-tight leading-none">Smart Society</h1><p class="text-[9px] text-indigo-600 font-bold uppercase tracking-widest mt-0.5">Complaint Resolution</p></div>
                </div>
                <div class="flex items-center space-x-4 relative">
                    <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>
                    <div class="flex items-center gap-3 cursor-default">
                        <div class="text-right hidden sm:block">
                            <p class="text-sm font-bold text-slate-900 leading-tight">{{ user?.name }}</p>
                            <p class="text-[0.65rem] text-slate-500 font-bold uppercase tracking-wider mt-0.5">{{ user?.role }}</p>
                        </div>
                        <div class="w-8 h-8 rounded-md bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm border border-indigo-200">{{ user?.name ? user.name.charAt(0) : 'U' }}</div>
                    </div>
                    <button @click="logout()" class="text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition p-1.5 rounded-md ml-1" title="Sign Out"><i class="fas fa-sign-out-alt text-lg"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-grow p-4 md:p-6 lg:p-8 max-w-7xl mx-auto w-full max-w-4xl space-y-6">
            <div class="flex items-center space-x-4 mb-2">
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Messages</h2>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-sm text-slate-800 uppercase tracking-wide mb-4">Send New Message</h3>
                <form @submit.prevent="sendMessage" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Recipient</label>
                        <select v-model="recipient" class="form-select w-full border border-slate-300 p-2.5 rounded-md text-sm bg-white font-medium" required>
                            <option value="" disabled>Select recipient...</option>
                            <option value="System Administrator">System Administrator (Admin)</option>
                            <option value="John Doe">John Doe (Resident)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Message</label>
                        <textarea v-model="messageText" rows="3" placeholder="Type your message here..." class="form-textarea w-full border border-slate-300 p-3 rounded-md text-sm resize-none font-medium" required></textarea>
                    </div>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-md shadow-sm transition text-sm">Send</button>
                </form>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                    <h3 class="font-bold text-sm text-slate-800 uppercase tracking-wide">Conversation History</h3>
                </div>
                <div class="divide-y divide-slate-100">
                    <div class="p-12 text-center text-slate-500 text-sm font-medium">
                        <i class="fas fa-inbox text-3xl text-slate-300 mb-3 block"></i>No messages yet. (Backend Integration Required)
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden items-center px-4 py-3 rounded-md shadow-lg border bg-slate-900 border-slate-800 text-white">
        <i class="fas fa-check-circle text-emerald-400 mr-3 text-lg"></i>
        <span id="toastMsg" class="font-medium text-sm">Success</span>
    </div>

    <script src="../js/utils.js"></script>
    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const user = ref(null);
                const recipient = ref('');
                const messageText = ref('');

                onMounted(() => {
                    user.value = requireAuth();
                });

                const sendMessage = () => {
                    showToast('Backend endpoint for DMs not implemented yet.', 'error');
                    messageText.value = '';
                    recipient.value = '';
                };

                return { user, recipient, messageText, sendMessage, logout, goHome };
            }
        }).mount('#app');
    </script>
</body>
</html>
