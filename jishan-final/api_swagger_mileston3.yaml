      - id: 3
        story: As a Society Manager, I want complaints to be categorized automatically
          (Electrical, Plumbing, Security, etc.), so that issues can be assigned to
          the correct personnel.
      description: Lists all available complaint categories (Electrical, Plumbing,
        Security, etc.) so a resident can classify a complaint at submission time
        (User Stories 1 & 3).
  /complaints:
    post:
      responses:
        '403':
          description: Forbidden
        '401':
