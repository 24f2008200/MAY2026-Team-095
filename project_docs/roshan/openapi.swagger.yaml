components:
  schemas:
    AssignLabourResponse:
      properties:
        message:
          type: string
          title: Message
        labourer_id:
          type: string
          format: uuid
          title: Labourer Id
        order_id:
          type: string
          format: uuid
          title: Order Id
      type: object
      required:
      - message
      - labourer_id
      - order_id
      title: AssignLabourResponse
    AssignRoleRequest:
      properties:
        role:
          type: string
          maxLength: 50
          title: Role
      type: object
      required:
      - role
      title: AssignRoleRequest
    AssignTruckRequest:
      properties:
        vehicle_id:
          type: string
          format: uuid
          title: Vehicle Id
        carrier:
          type: string
          maxLength: 100
          minLength: 1
          title: Carrier
        order_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Order Id
      type: object
      required:
      - vehicle_id
      - carrier
      title: AssignTruckRequest
    AssignWarehouseRequest:
      properties:
        warehouse_id:
          type: string
          format: uuid
          title: Warehouse Id
      type: object
      required:
      - warehouse_id
      title: AssignWarehouseRequest
    AvailabilityItem:
      properties:
        labourer_id:
          type: string
          format: uuid
          title: Labourer Id
        user_id:
          type: string
          format: uuid
          title: User Id
        warehouse_id:
          type: string
          format: uuid
          title: Warehouse Id
        skill_tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Skill Tags
      type: object
      required:
      - labourer_id
      - user_id
      - warehouse_id
      - skill_tags
      title: AvailabilityItem
    BatchAssignment:
      properties:
        order_id:
          type: string
          format: uuid
          title: Order Id
        driver_id:
          type: string
          format: uuid
          title: Driver Id
        vehicle_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Vehicle Id
      type: object
      required:
      - order_id
      - driver_id
      title: BatchAssignment
    BatchConfirmRequest:
      properties:
        assignments:
          items:
            $ref: '#/components/schemas/BatchAssignment'
          type: array
          title: Assignments
      type: object
      required:
      - assignments
      title: BatchConfirmRequest
    Body_estimate_image_api_v1_ai_estimate_image_post:
      properties:
        file:
          type: string
          format: binary
          title: File
          description: "Room photo \u2014 JPG or PNG, max 15 MB"
      type: object
      required:
