  /api/v1/ai/escalate/{conversation_id}:
    post:
      tags:
      - AI
      summary: Escalate conversation to human agent
      description: Flag a conversation for human review. The conversation must belong
        to the requesting user.
      operationId: escalate_conversation_api_v1_ai_escalate__conversation_id__post
