  /api/v1/ai/escalations:
    get:
      tags:
      - AI
      summary: List escalations
      description: 'Human agent view: list all escalations. Use ?status=OPEN or ?status=RESOLVED
        to filter.'
      operationId: list_escalations_api_v1_ai_escalations_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by status: OPEN or RESOLVED'
          title: Status
        description: 'Filter by status: OPEN or RESOLVED'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ai/escalations/{escalation_id}/resolve:
    put:
      tags:
