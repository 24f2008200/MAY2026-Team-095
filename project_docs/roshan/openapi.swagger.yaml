              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ai/estimate-image:
    post:
      tags:
      - AI
      summary: Analyze a room photo for moving estimate
      description: Upload an image. Gemini Vision detects items and returns a moving
        estimate.
      operationId: estimate_image_api_v1_ai_estimate_image_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_estimate_image_api_v1_ai_estimate_image_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ai/chat:
    post:
      tags:
      - AI
      summary: Send a message to the AI chatbot
      description: Send a natural language message. The AI decides whether to query
        the database or respond directly. Pass `session_id` to continue an existing
        conversation, or omit it to start a new one.
      operationId: chat_api_v1_ai_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/ai/conversations/{session_id}:
    get:
      tags:
      - AI
      summary: Get conversation history
      description: Retrieve all messages for a specific conversation session.
      operationId: get_conversation_api_v1_ai_conversations__session_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationHistory'
        '422':
