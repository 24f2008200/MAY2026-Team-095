<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Society | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" class="min-h-screen flex flex-col bg-slate-50">
        <main class="flex-grow w-full h-screen flex justify-center items-center">
            <div class="bg-white shadow-xl rounded-none flex flex-col md:flex-row w-full h-full overflow-hidden border-0">
                <div class="w-full md:w-1/2 p-6 md:p-10 flex flex-col justify-center">
                    <div class="mb-8">
                        <h2 class="font-extrabold text-2xl text-slate-900 tracking-tight mb-1">Access Portal</h2>
                        <p class="text-sm text-slate-500 font-medium">Sign in to the complaint resolution system.</p>
                    </div>

                    <form @submit.prevent="handleLogin" class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Email Address</label>
                            <input v-model="email" type="email" placeholder="e.g., resident@society.com" class="form-input w-full border border-slate-300 p-2.5 rounded-md text-sm text-slate-900 transition" required />
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Password</label>
                                <a href="static/forgot-password.html" class="text-xs text-indigo-600 hover:text-indigo-800 font-bold transition">Recover</a>
                            </div>
                            <input v-model="password" type="password" placeholder=" " class="form-input w-full border border-slate-300 p-2.5 rounded-md text-sm text-slate-900 transition" required />
                        </div>
                        <button type="submit" :disabled="isLoading" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-md transition shadow-sm mt-2 disabled:opacity-50">
                            {{ isLoading ? 'Authenticating...' : 'Authenticate' }}
                        </button>
                    </form>

                    <div class="mt-8 text-center text-sm font-medium border-t border-slate-100 pt-6">
                        <span class="text-slate-500">Unregistered resident?</span>
                        <a href="static/register.html" class="text-indigo-600 font-bold hover:text-indigo-800 transition ml-1">Request Access</a>
                    </div>
                </div>

                <div class="w-full md:w-1/2 bg-slate-900 text-white p-8 md:p-12 relative overflow-hidden flex flex-col justify-between">
                    <div class="absolute -right-20 -bottom-20 opacity-5 pointer-events-none"><i class="fas fa-city text-[300px]"></i></div>
                    <div class="relative z-10 mb-8">
                        <div class="mb-6"><img src="images/logo.svg" alt="Smart Society Logo" class="w-12 h-12 rounded-lg shadow-md" /></div>
                        <h3 class="font-extrabold text-2xl mb-3 leading-snug tracking-tight">Complaint Resolution System</h3>
                        <p class="text-slate-400 text-sm leading-relaxed">A dedicated platform for residents and staff to seamlessly track, manage, and resolve all society maintenance issues.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden items-center px-4 py-3 rounded-md shadow-lg border bg-slate-900 border-slate-800 text-white">
        <i class="fas fa-check-circle text-emerald-400 mr-3 text-lg"></i>
        <span id="toastMsg" class="font-medium text-sm">Success</span>
    </div>

    <script src="js/utils.js"></script>
    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const email = ref('');
                const password = ref('');
                const isLoading = ref(false);

                onMounted(() => {
                    const user = getCurrentUser();
                    const token = localStorage.getItem('smartSocietyToken');
                    if (user && token) {
                        redirectUser(user.role);
                    }
                });

                const redirectUser = (role) => {
                    if (role === 'ADMIN') window.location.href = 'static/dashboard-admin.html';
                    else if (role === 'STAFF') window.location.href = 'static/dashboard-staff.html';
                    else window.location.href = 'static/dashboard-resident.html';
                };

                const handleLogin = async () => {
                    isLoading.value = true;
                    try {
                        const response = await apiCall('/auth/login', {
                            method: 'POST',
                            body: { email: email.value.trim(), password: password.value.trim() }
                        });
                        setCurrentUser(response.user, response.access_token);
                        showToast('Authenticated successfully.');
                        setTimeout(() => redirectUser(response.user.role), 400);
                    } catch (err) {
                        // Handled by apiCall interceptor toast
                    } finally {
                        isLoading.value = false;
                    }
                };

                return { email, password, isLoading, handleLogin };
            }
        }).mount('#app');
    </script>
</body>
</html>
