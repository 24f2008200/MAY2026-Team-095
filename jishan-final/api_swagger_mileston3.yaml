          schema:
            $ref: '#/definitions/ErrorResponse'
        '200':
          description: Updated
        '401':
          description: Unauthorized - missing, invalid, or expired JWT access token.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error - unexpected failure while processing
            the request.
          schema:
            $ref: '#/definitions/ErrorResponse'
      description: Updates editable fields of an existing complaint.
