info:
  title: Smart Society API
  version: 1.0.0
  description: 'Apartment Maintenance & Complaint Resolution System API - Smart Society.


    This specification documents all backend APIs implemented for Milestone 3 / Sprint
    1 (Aug), each endpoint''s error responses, and its mapping to the Milestone-3
    user stories (see the `x-user-stories` extension on each operation, and the consolidated
    table under `x-milestone-3-user-stories` below).


    GenAI / third-party API integration: none. All endpoints listed here are custom-built
    by the dev team on Flask + Flask-RESTX; no external GenAI or open-source AI APIs
    were integrated into this milestone''s feature set.'
produces:
- application/json
consumes:
- application/json
securityDefinitions:
  Bearer:
    type: apiKey
    in: header
    name: Authorization
    description: 'JWT Authorization Header. Example: Bearer <token>'
security:
- Bearer: []
tags:
- name: auth
  description: Authentication APIs
- name: complaints
  description: Complaint management APIs
- name: categories
  description: Complaint category APIs
- name: admin
  description: Admin management APIs
- name: staff
  description: Staff complaint management APIs
- name: notifications
  description: User notification APIs
definitions:
  RegisterRequest:
    required:
    - building
    - email
    - flat_number
    - mobile_number
    - name
    - password
    properties:
      name:
        type: string
        example: Thomas Reed
      email:
        type: string
        example: thomas.reed@example.com
      mobile_number:
        type: string
        example: '9876543210'
      password:
        type: string
        example: Password@123
      flat_number:
        type: string
        example: A101
      building:
        type: string
        example: Block A
    type: object
  LoginRequest:
    required:
    - email
    - password
    properties:
      email:
        type: string
        example: thomas.reed@example.com
      password:
        type: string
        example: Password@123
    type: object
  ForgotPasswordRequest:
    required:
    - email
    properties:
      email:
        type: string
        example: thomas.reed@example.com
    type: object
  VerifyResetOtpRequest:
    required:
    - email
    - otp
    properties:
      email:
        type: string
        example: thomas.reed@example.com
      otp:
        type: string
        example: '483921'
    type: object
  ResetPasswordRequest:
    required:
    - email
    - reset_token
    - password
    properties:
      email:
        type: string
        example: thomas.reed@example.com
      reset_token:
        type: string
        example: verified-reset-token
      password:
        type: string
        example: NewPassword@123
    type: object
  CreateComplaintRequest:
    required:
    - category_id
    - description
    - location
    - title
    properties:
      category_id:
        type: integer
        example: 1
      title:
        type: string
        example: Water leakage in kitchen
      description:
        type: string
        example: There is continuous water leakage under the kitchen sink.
      location:
        type: string
        example: Flat A101, Kitchen
      priority:
        type: string
        example: MEDIUM
    type: object
  UpdateComplaintRequest:
    properties:
      title:
        type: string
        example: Updated title
      description:
        type: string
        example: Updated description
      location:
        type: string
        example: Flat A101
      priority:
        type: string
        example: HIGH
    type: object
  ComplaintTimelineCommentRequest:
    required:
    - comment
    properties:
      comment:
        type: string
        example: Just checking on the status of this.
    type: object
  FeedbackRequest:
    required:
    - rating
    properties:
      rating:
        type: integer
        example: 4
      comment:
        type: string
        example: Issue resolved quickly.
    type: object
  AssignStaffRequest:
    required:
    - staff_id
    properties:
      staff_id:
        type: integer
        example: 2
    type: object
  CreateStaffRequest:
    required:
    - email
    - name
    - password
    - trade
    properties:
      name:
        type: string
        example: Sarah Connor
      email:
        type: string
        example: staff@smartsociety.com
      mobile_number:
        type: string
        example: '9876543210'
      flat_number:
        type: string
        example: A-101
      building:
        type: string
        example: Block A
      password:
        type: string
        example: Staff@123
      trade:
        type: string
        example: Plumber
    type: object
  CreateCategoryRequest:
    required:
    - name
    properties:
      name:
        type: string
        example: Plumbing
      description:
        type: string
        example: Water and pipe related issues
    type: object
  StatusUpdateRequest:
    required:
    - status
    properties:
      status:
        type: string
        example: IN_PROGRESS
      comment:
        type: string
        example: Started working on the issue.
    type: object
  TimelineCommentRequest:
    required:
    - comment
    properties:
      comment:
        type: string
        example: Inspected the area and ordered replacement parts.
    type: object
  ErrorResponse:
    type: object
    properties:
      success:
        type: boolean
        example: false
      message:
        type: string
        example: Human readable error message.
      errors:
        type: object
        description: Present on 400 validation errors - field name to list of validation
          messages.
        additionalProperties:
          type: array
          items:
            type: string
responses:
  ParseError:
    description: When a mask can't be parsed
  MaskError:
    description: When any error occurs on mask
x-milestone-3-user-stories:
- sl_no: 1
  user_story: As a Resident, I want to submit a complaint with its description, category,
    and photos, so that maintenance issues can be reported accurately and quickly.
  apis:
  - POST /complaints
  - GET /categories
- sl_no: 2
  user_story: As a Resident, I want to receive a unique complaint reference number
    after submitting a complaint, so that I can track its progress.
  apis:
  - POST /complaints
- sl_no: 3
  user_story: As a Society Manager, I want complaints to be categorized automatically
    (Electrical, Plumbing, Security, etc.), so that issues can be assigned to the
    correct personnel.
  apis:
  - GET /categories
  - POST /admin/categories
- sl_no: 4
  user_story: As a Resident, I want to view the real time status of my complaint,
    so that I know the progress of issue resolution.
  apis:
  - GET /complaints/{complaint_id}
- sl_no: 5
  user_story: As a Resident, I want to receive notifications whenever my complaint
    status changes, so that I stay informed without contacting management.
  apis:
  - GET /notifications
  - PUT /notifications/{notification_id}/read
  - PUT /notifications/read-all
- sl_no: 6
  user_story: As a Society Manager, I want to assign complaints to maintenance staff
    based on their expertise, so that issues are resolved by qualified personnel.
  apis:
  - POST /admin/staff
  - PUT /admin/complaints/{complaint_id}/assign
- sl_no: 7
  user_story: As a Maintenance staff, I want to receive digital work orders with complaint
    details, priority, resident information and location so that I clearly understand
    the maintenance requirements.
  apis:
  - GET /complaints/{complaint_id}
- sl_no: 8
  user_story: As a Maintenance staff, I want to update the status of assigned tasks,
    so that management and residents can track progress effectively.
  apis:
  - PUT /staff/complaints/{complaint_id}/status
- sl_no: 9
  user_story: As a Resident, I want to rate the quality of maintenance work, so that
    management can evaluate service performance.
  apis:
  - POST /complaints/{complaint_id}/feedback
- sl_no: 14
  user_story: As a Chairman, I want to view a dashboard showing pending, resolved,
    and overdue complaints, so that I can monitor the overall maintenance performance
    of the association.
  apis:
  - GET /admin/dashboard
x-genai-integrations: None used in this milestone. All APIs are custom-implemented
  by the dev team.
