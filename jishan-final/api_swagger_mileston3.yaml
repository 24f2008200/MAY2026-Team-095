          schema:
            $ref: '#/definitions/ErrorResponse'
      operationId: post_admin_staff_create_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          $ref: '#/definitions/CreateStaffRequest'
      security:
      - Bearer: []
      tags:
      - admin
      x-user-stories:
      - id: 6
        story: As a Society Manager, I want to assign complaints to maintenance staff
          based on their expertise, so that issues are resolved by qualified personnel.
      description: Creates a new maintenance staff account with an expertise/category,
        so complaints can later be routed to qualified personnel (User Story 6).
  /admin/staff/{staff_id}:
    parameters:
    - name: staff_id
      in: path
      required: true
      type: integer
    delete:
      responses:
        '403':
          description: Forbidden - authenticated user's role/ownership does not permit
            this action.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Not Found - the requested resource (complaint, staff, notification,
