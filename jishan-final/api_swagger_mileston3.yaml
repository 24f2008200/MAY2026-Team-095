swagger: '2.0'
basePath: /
paths:
  /admin/categories:
    post:
      responses:
        '409':
          description: Conflict - resource already exists or is in a state that prevents
            this action.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '201':
          description: Category created
        '400':
          description: Validation error - request body/query params failed schema
            validation.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Unauthorized - missing, invalid, or expired JWT access token.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '403':
          description: Forbidden - authenticated user's role/ownership does not permit
            this action.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error - unexpected failure while processing
            the request.
          schema:
            $ref: '#/definitions/ErrorResponse'
      operationId: post_admin_category_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          $ref: '#/definitions/CreateCategoryRequest'
      security:
      - Bearer: []
      tags:
      - admin
      x-user-stories:
      - id: 3
        story: As a Society Manager, I want complaints to be categorized automatically
          (Electrical, Plumbing, Security, etc.), so that issues can be assigned to
          the correct personnel.
      description: Allows a Society Manager/Admin to create a new complaint category,
        supporting automatic classification of future complaints (User Story 3).
  /admin/complaints:
    get:
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized - missing, invalid, or expired JWT access token.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '403':
          description: Forbidden - authenticated user's role/ownership does not permit
            this action.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error - unexpected failure while processing
            the request.
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List all complaints with optional filtering
      operationId: get_admin_complaint_list_resource
      parameters:
      - description: Filter by status (OPEN, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED,
          REOPENED)
        name: status
        type: string
        in: query
      - description: Filter by priority (LOW, MEDIUM, HIGH, URGENT)
        name: priority
        type: string
        in: query
      - description: Search in title or complaint_code
        name: search
        type: string
        in: query
      - description: Page number
        name: page
        type: string
        in: query
      - description: 'Items per page (default: 10, max: 100)'
        name: per_page
        type: string
        in: query
      security:
      - Bearer: []
      tags:
      - admin
      description: Lists and filters all complaints across the society, for admin/manager
        oversight.
  /admin/complaints/{complaint_id}/assign:
    parameters:
    - name: complaint_id
      in: path
      required: true
      type: integer
    put:
      responses:
        '404':
          description: Not Found - the requested resource (complaint, staff, notification,
            etc.) does not exist.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '400':
          description: Validation error - request body/query params failed schema
            validation.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '200':
          description: Staff assigned
        '401':
          description: Unauthorized - missing, invalid, or expired JWT access token.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '403':
          description: Forbidden - authenticated user's role/ownership does not permit
            this action.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error - unexpected failure while processing
            the request.
          schema:
            $ref: '#/definitions/ErrorResponse'
      operationId: put_admin_assign_staff_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          $ref: '#/definitions/AssignStaffRequest'
      security:
      - Bearer: []
      tags:
      - admin
      x-user-stories:
      - id: 6
        story: As a Society Manager, I want to assign complaints to maintenance staff
          based on their expertise, so that issues are resolved by qualified personnel.
      description: Assigns a complaint to a maintenance staff member based on their
        expertise/category (User Story 6).
  /admin/dashboard:
    get:
      responses:
        '403':
          description: Forbidden - authenticated user's role/ownership does not permit
            this action.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '200':
          description: Success
        '401':
          description: Unauthorized - missing, invalid, or expired JWT access token.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error - unexpected failure while processing
            the request.
          schema:
            $ref: '#/definitions/ErrorResponse'
      operationId: get_admin_dashboard_resource
      security:
      - Bearer: []
      tags:
      - admin
      x-user-stories:
      - id: 14
        story: As a Chairman, I want to view a dashboard showing pending, resolved,
          and overdue complaints, so that I can monitor the overall maintenance performance
          of the association.
      description: Returns aggregated counts of pending, resolved and overdue complaints
        for the Chairman/Admin overview dashboard (User Story 14).
  /admin/reports:
    get:
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized - missing, invalid, or expired JWT access token.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '403':
          description: Forbidden - authenticated user's role/ownership does not permit
            this action.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error - unexpected failure while processing
            the request.
          schema:
            $ref: '#/definitions/ErrorResponse'
      operationId: get_admin_reports_resource
      security:
      - Bearer: []
      tags:
      - admin
      description: Returns complaint analytics broken down by category and priority.
  /admin/staff:
    post:
      responses:
        '409':
