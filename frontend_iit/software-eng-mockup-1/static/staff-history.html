<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Society | Staff History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
    <div id="app" class="min-h-screen flex flex-col bg-slate-50">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex justify-between items-center">
                <div class="flex items-center cursor-pointer" onclick="goHome()">
                    <div class="mr-3"><svg viewBox="0 0 100 100" class="w-8 h-8 rounded-md shadow-sm" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#000000"/><path d="M25 75 L50 25 L75 75" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                    <div><h1 class="font-extrabold text-lg text-slate-900 tracking-tight leading-none">Smart Society</h1><p class="text-[9px] text-indigo-600 font-bold uppercase tracking-widest mt-0.5">Complaint Resolution</p></div>
                </div>
                <div><button onclick="logout()" class="text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition p-1.5 rounded-md ml-1"><i class="fas fa-sign-out-alt text-lg"></i></button></div>
            </div>
            <div class="bg-slate-50 border-t border-slate-200">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-6 overflow-x-auto">
                    <a href="dashboard-staff.html" class="py-2.5 text-[0.8rem] font-bold border-b-2 transition-colors duration-150 whitespace-nowrap flex items-center border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300"><i class="fas fa-clipboard-list mr-2 opacity-70"></i> My Queue</a>
                    <a href="staff-history.html" class="py-2.5 text-[0.8rem] font-bold border-b-2 transition-colors duration-150 whitespace-nowrap flex items-center border-indigo-600 text-indigo-700"><i class="fas fa-check-double mr-2 opacity-70"></i> History</a>
                    <a href="messages.html" class="py-2.5 text-[0.8rem] font-bold border-b-2 transition-colors duration-150 whitespace-nowrap flex items-center border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300"><i class="fas fa-comments mr-2 opacity-70"></i> Messages</a>
                </div>
            </div>
        </header>

        <main class="flex-grow p-4 md:p-6 lg:p-8 max-w-7xl mx-auto w-full space-y-6">
            <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-5 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">My Resolution Archive</h2>
                        <p class="text-xs text-slate-500 mt-1 font-medium">Review completed jobs and resident feedback.</p>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50/50 border-b border-slate-200">
                            <tr>
                                <th class="px-5 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Ref ID</th>
                                <th class="px-5 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Trade</th>
                                <th class="px-5 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Closure Date</th>
                                <th class="px-5 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Status</th>
                                <th class="px-5 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Resident Review</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody" class="divide-y divide-slate-100 bg-white"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/store.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function() {
            const user = requireAuth('Staff');
            if (!user) return;

            const staffName = user.name;
            const completed = store.complaints.filter(c => c.assignedTo === staffName && ['Resolved','Closed'].includes(c.status));
            const tbody = document.getElementById('historyBody');

            if (completed.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-5 py-12 text-center text-slate-500 text-sm font-medium">No historical resolution records found.</td></tr>`;
            } else {
                completed.forEach(c => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition duration-150';

                    const lastAction = c.history[c.history.length - 1];
                    const closureDate = lastAction ? lastAction.date : c.date;

                    // Generate literal stars: e.g., 3 stars = ★★★☆☆
                    const rating = parseInt(c.feedback?.rating || 0);
                    const reviewHtml = c.feedback
                        ? `<div class="text-amber-400 text-[13px] tracking-tighter">
                            ${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}
                           </div>`
                        : `<span class="text-slate-400 text-[10px] italic">Pending</span>`;

                    tr.innerHTML = `
                        <td class="px-5 py-4 font-bold text-slate-800 text-sm">${c.id}</td>
                        <td class="px-5 py-4 text-sm text-slate-700 font-medium">${c.category}</td>
                        <td class="px-5 py-4 text-xs font-medium text-slate-500">${closureDate}</td>
                        <td class="px-5 py-4">
                            <span class="px-2 py-1 text-[10px] font-bold text-emerald-700 bg-emerald-50 rounded-full uppercase">Completed</span>
                        </td>
                        <td class="px-5 py-4">${reviewHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        })();
    </script>
</body>
</html>
