openapi: 3.0.3
info:
  title: Smart Society Complaint Resolution System API
  description: >
    API contract between the Vue 2 frontend and the FastAPI backend for the
    Apartment Association Complaint Management Platform (Team Sputnik, MAY2026-Team-095).
    Covers Resident, Admin, and Maintenance Staff dashboards plus the shared
    Notification Center, based on Milestone 1 wireframes and user stories.
  version: 1.0.0
  contact:
    name: Team Sputnik
servers:
  - url: https://api.smartsociety.example.com/v1
    description: Production (placeholder - replace with real backend URL)
  - url: http://localhost:8000/v1
    description: Local FastAPI dev server

tags:
  - name: Auth
  - name: Users
  - name: Categories
  - name: Resident Complaints
  - name: Admin Complaints
  - name: Staff Complaints
  - name: Notifications

security:
  - bearerAuth: []

paths:

  # ---------------- AUTH ----------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (Resident, Admin, or Maintenance Staff)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, example: "Mrs Pqrst" }
                email: { type: string, format: email }
                mobileNumber: { type: string, example: "9876543210" }
                password: { type: string, format: password }
                role: { $ref: '#/components/schemas/Role' }
                flatNumber: { type: string, example: "B-101" }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409':
          description: Email already registered

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with username/email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernameOrEmail, password]
              properties:
                usernameOrEmail: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login successful, returns JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: bearer }
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Invalid credentials

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Trigger a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset link sent if the email exists

  # ---------------- USERS ----------------
  /users/me:
    get:
      tags: [Users]
      summary: Get the current logged-in user's profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ---------------- CATEGORIES ----------------
  /categories:
    get:
      tags: [Categories]
      summary: Get complaint category/sub-category options (for the Raise New Complaint form)
      responses:
        '200':
          description: List of categories with sub-categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category: { type: string, example: "Water Leakage" }
                    subCategories:
                      type: array
                      items: { type: string }
                      example: ["Tap Leakage", "Pipe Burst"]

  # ---------------- RESIDENT COMPLAINTS ----------------
  /complaints:
    post:
      tags: [Resident Complaints]
      summary: Raise a new complaint (Resident Dashboard > Raise New Complaint)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, priority, location, description]
              properties:
                category: { type: string }
                subCategory: { type: string }
                priority: { $ref: '#/components/schemas/Priority' }
                location: { type: string, example: "Bathroom / Lobby" }
                description: { type: string }
                photos:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Complaint created, returns generated Complaint ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }

    get:
      tags: [Resident Complaints]
      summary: List complaints raised by the logged-in resident (My Complaints)
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/CategoryFilter'
      responses:
        '200':
          description: List of the resident's complaints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Complaint' }

  /complaints/{complaintId}:
    get:
      tags: [Resident Complaints]
      summary: Get complaint detail (My Complaint Details panel)
      parameters:
        - $ref: '#/components/parameters/ComplaintIdPath'
      responses:
        '200':
          description: Complaint detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '404':
          description: Complaint not found

  /complaints/{complaintId}/timeline:
    get:
      tags: [Resident Complaints]
      summary: Get "Updates / Comments" timeline for a complaint
      parameters:
        - $ref: '#/components/parameters/ComplaintIdPath'
      responses:
        '200':
          description: Chronological list of status updates/comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ComplaintUpdate' }

  /complaints/{complaintId}/attachments:
    post:
      tags: [Resident Complaints]
      summary: Upload additional evidence photos/videos to an existing complaint
      parameters:
        - $ref: '#/components/parameters/ComplaintIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Attachments added
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }

  /complaints/{complaintId}/feedback:
    post:
      tags: [Resident Complaints]
      summary: Confirm resolution and submit a star rating + feedback comment
      parameters:
        - $ref: '#/components/parameters/ComplaintIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
                comment: { type: string }
      responses:
        '200':
          description: Feedback recorded, complaint moves to Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }

  # ---------------- ADMIN ----------------
  /admin/dashboard/summary:
    get:
      tags: [Admin Complaints]
      summary: Admin dashboard counters (Total / Open / In Progress / Resolved)
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }

  /admin/complaints:
    get:
      tags: [Admin Complaints]
      summary: All Complaints table with filters (Admin Dashboard)
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/Priority' }
        - name: search
          in: query
          description: Free-text search on Complaint ID / Resident / Category
          schema: { type: string }
      responses:
        '200':
          description: Filtered list of all complaints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Complaint' }

  /admin/complaints/{complaintId}/assign:
    put:
      tags: [Admin Complaints]
      summary: Assign a complaint to a staff member (Assign Complaint panel)
      parameters:
        - $ref: '#/components/parameters/ComplaintIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId, status]
              properties:
                staffId: { type: string }
                status: { $ref: '#/components/schemas/Status' }
                remarks: { type: string }
      responses:
        '200':
          description: Complaint assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }

  /admin/complaints/report:
    get:
      tags: [Admin Complaints]
      summary: Generate/export All Complaints Report (date range + status filter)
      parameters:
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/StatusFilter'
        - name: format
          in: query
          description: Export format
          schema: { type: string, enum: [json, csv, pdf], default: json }
      responses:
        '200':
          description: Report data or downloadable file
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Complaint' }
            text/csv:
              schema: { type: string }

  # ---------------- MAINTENANCE STAFF ----------------
  /staff/dashboard/summary:
    get:
      tags: [Staff Complaints]
      summary: Staff dashboard counters (Assigned / In Progress / Completed / Pending)
      responses:
        '200':
          description: Dashboard summary for logged-in staff member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }

  /staff/complaints:
    get:
      tags: [Staff Complaints]
      summary: My Assigned Complaints list
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Complaints assigned to the logged-in staff member
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Complaint' }

  /staff/complaints/{complaintId}/status:
    put:
      tags: [Staff Complaints]
      summary: Update complaint status with comment/photo evidence (Update Complaint Status panel)
      parameters:
        - $ref: '#/components/parameters/ComplaintIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/Status' }
                comment: { type: string, example: "Reached the site, checking the pipeline." }
                photos:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Status updated, resident notified automatically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }

  /staff/complaints/history:
    get:
      tags: [Staff Complaints]
      summary: My Work History (completed complaints)
      responses:
        '200':
          description: List of completed complaints for the logged-in staff member
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Complaint' }

  /staff/notification-preferences:
    get:
      tags: [Staff Complaints]
      summary: Get Staff Notification Preferences (channels + quiet hours)
      responses:
        '200':
          description: Current preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffNotificationPreferences' }
    put:
      tags: [Staff Complaints]
      summary: Update Staff Notification Preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffNotificationPreferences' }
      responses:
        '200':
          description: Preferences saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffNotificationPreferences' }

  # ---------------- NOTIFICATIONS (shared across roles) ----------------
  /notifications:
    get:
      tags: [Notifications]
      summary: Notification Center feed for the logged-in user
      parameters:
        - name: channel
          in: query
          description: Filter by delivery channel tab (All / Email / SMS / In-App)
          schema:
            type: string
            enum: [All, Email, SMS, InApp]
            default: All
      responses:
        '200':
          description: Notification list, most recent first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }

  /notifications/{notificationId}/read:
    put:
      tags: [Notifications]
      summary: Mark a single notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Marked as read

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all as read
      responses:
        '200':
          description: All notifications marked as read

  /notifications/settings:
    get:
      tags: [Notifications]
      summary: Get Notification Settings (Email/SMS/In-App toggles)
      responses:
        '200':
          description: Current notification settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
    put:
      tags: [Notifications]
      summary: Save Notification Settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ComplaintIdPath:
      name: complaintId
      in: path
      required: true
      schema: { type: string, example: "C-1001" }
    StatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/Status' }
    CategoryFilter:
      name: category
      in: query
      schema: { type: string }

  schemas:
    Role:
      type: string
      enum: [Resident, Admin, MaintenanceStaff]

    Priority:
      type: string
      enum: [Low, Medium, High]

    Status:
      type: string
      enum: [Open, Assigned, "In Progress", Resolved, Closed, Reopened]

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        mobileNumber: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        flatNumber: { type: string }

    Attachment:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        filename: { type: string }
        uploadedAt: { type: string, format: date-time }

    ComplaintUpdate:
      type: object
      description: One row in the "Updates / Comments" timeline
      properties:
        id: { type: string }
        complaintId: { type: string }
        timestamp: { type: string, format: date-time }
        actor: { type: string, example: "Ramesh (Plumber)" }
        action: { type: string, example: "Started working" }
        comment: { type: string }

    Complaint:
      type: object
      properties:
        id: { type: string, example: "C-1001" }
        category: { type: string, example: "Water Leakage" }
        subCategory: { type: string, example: "Tap Leakage" }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/Status' }
        location: { type: string, example: "Bathroom" }
        description: { type: string }
        residentId: { type: string }
        residentName: { type: string, example: "Mr. Abcde (B-101)" }
        assignedStaffId: { type: string, nullable: true }
        assignedStaffName: { type: string, nullable: true, example: "Ramesh (Plumber)" }
        dateRaised: { type: string, format: date-time }
        dateResolved: { type: string, format: date-time, nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        feedbackComment: { type: string, nullable: true }

    DashboardSummary:
      type: object
      description: Counter cards shown at the top of each dashboard
      properties:
        total: { type: integer }
        open: { type: integer }
        assigned: { type: integer }
        inProgress: { type: integer }
        resolved: { type: integer }
        closed: { type: integer }
        pending: { type: integer }

    Notification:
      type: object
      properties:
        id: { type: string }
        complaintId: { type: string, nullable: true }
        type:
          type: string
          enum: [ComplaintRegistered, ComplaintAssigned, WorkStarted, ComplaintResolved, FeedbackRequest]
        title: { type: string, example: "Complaint Assigned" }
        message: { type: string }
        channel:
          type: string
          enum: [Email, SMS, InApp]
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    NotificationSettings:
      type: object
      properties:
        emailAlerts: { type: boolean, default: true }
        smsAlerts: { type: boolean, default: true }
        inAppAlerts: { type: boolean, default: true }
        complaintStatusUpdates:
          type: string
          enum: [All, Important Only, None]
          default: All
        newAssignmentAlerts:
          type: string
          enum: [All, Important Only, None]
          default: All
        marketingOptIn: { type: boolean, default: false }

    StaffNotificationPreferences:
      type: object
      properties:
        receiveViaEmail: { type: boolean, default: true }
        receiveViaSms: { type: boolean, default: true }
        receiveViaInApp: { type: boolean, default: true }
        quietHoursFrom: { type: string, example: "11:00 PM" }
        quietHoursTo: { type: string, example: "07:00 AM" }
