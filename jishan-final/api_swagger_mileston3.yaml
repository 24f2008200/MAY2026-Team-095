          schema:
            $ref: '#/definitions/ErrorResponse'
        '201':
          description: Complaint created
        '500':
          description: Internal Server Error - unexpected failure while processing
            the request.
          schema:
            $ref: '#/definitions/ErrorResponse'
      description: Creates a new maintenance complaint with description, category
        and optional photos, and returns a unique complaint reference code used for
        tracking (User Stories 1 & 2).
      operationId: post_complaint_list_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          $ref: '#/definitions/CreateComplaintRequest'
      security:
      - Bearer: []
      tags:
      - complaints
      x-user-stories:
      - id: 1
        story: As a Resident, I want to submit a complaint with its description, category,
          and photos, so that maintenance issues can be reported accurately and quickly.
      - id: 2
        story: As a Resident, I want to receive a unique complaint reference number
          after submitting a complaint, so that I can track its progress.
    get:
      responses:
        '403':
          description: Forbidden
        '401':
          description: Unauthorized - missing, invalid, or expired JWT access token.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '200':
          description: Success
        '500':
          description: Internal Server Error - unexpected failure while processing
            the request.
          schema:
            $ref: '#/definitions/ErrorResponse'
      description: Lists complaints belonging to (or visible to) the authenticated
        resident, with optional filters.
      operationId: get_complaint_list_resource
      parameters:
      - description: 'Page number (default: 1)'
        name: page
        type: string
        in: query
      - description: 'Items per page (default: 10, max: 100)'
        name: per_page
        type: string
        in: query
      - description: Filter by status (OPEN, ASSIGNED, etc.)
        name: status
        type: string
        in: query
      - description: Filter by priority (LOW, MEDIUM, HIGH, URGENT)
        name: priority
        type: string
        in: query
      - description: Filter by category ID
        name: category_id
        type: string
        in: query
      - description: Search in title, code, or location
        name: search
        type: string
        in: query
      security:
      - Bearer: []
      tags:
      - complaints
  /complaints/{complaint_id}:
