          schema:
            $ref: '#/definitions/ErrorResponse'
      operationId: delete_admin_staff_resource
      security:
      - Bearer: []
      tags:
      - admin
      description: Removes a maintenance staff account.
  /auth/forgot-password:
    post:
      responses:
        '400':
          description: Validation error - request body/query params failed schema
            validation.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '200':
          description: Request accepted
        '500':
          description: Internal Server Error - unexpected failure while processing
            the request.
          schema:
            $ref: '#/definitions/ErrorResponse'
      description: Sends a six-digit, ten-minute password-reset verification code
        when the email is registered. The current password remains unchanged and
        unknown addresses receive the same generic response.
      operationId: post_forgot_password_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          $ref: '#/definitions/ForgotPasswordRequest'
      tags:
      - auth
  /auth/verify-reset-otp:
    post:
      responses:
        '400':
          description: Invalid, expired, or malformed verification code
          schema:
            $ref: '#/definitions/ErrorResponse'
        '200':
          description: Verification code accepted
        '500':
          description: Internal Server Error - unexpected failure while processing
            the request.
          schema:
            $ref: '#/definitions/ErrorResponse'
      description: Verifies a recovery code before any new password is accepted
        and returns a short-lived one-time reset token. Codes allow five failed
        attempts.
      operationId: post_verify_reset_otp_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          $ref: '#/definitions/VerifyResetOtpRequest'
      tags:
      - auth
  /auth/reset-password:
    post:
