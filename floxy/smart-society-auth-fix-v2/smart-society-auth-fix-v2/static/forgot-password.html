<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Society | Forgot Password</title>
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
    <div id="app" class="min-h-screen w-full flex flex-col md:flex-row m-0 p-0 overflow-x-hidden">
        <div class="w-full md:w-1/2 p-6 sm:p-12 md:p-16 flex flex-col justify-center bg-white order-2 md:order-1 md:min-h-screen overflow-y-auto">
            <div class="w-full max-w-md mx-auto space-y-8 py-4 sm:py-6">
                <div>
                    <h2 class="font-extrabold text-3xl text-slate-900 tracking-tight mb-2">Reset Password</h2>
                    <p class="text-sm text-slate-500 font-medium">Enter your email to receive password recovery instructions.</p>
                </div>

                <div v-if="errorMessage" role="alert" aria-live="polite" class="auth-alert auth-alert-error">
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                    <span>{{ errorMessage }}</span>
                </div>

                <div v-if="successMessage" role="status" aria-live="polite" class="auth-alert auth-alert-success">
                    <i class="fas fa-check-circle" aria-hidden="true"></i>
                    <span>{{ successMessage }}</span>
                </div>

                <form @submit.prevent="handleForgot" class="space-y-6" novalidate>
                    <div>
                        <label for="recoveryEmail" class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Email Address</label>
                        <input id="recoveryEmail" v-model="email" @input="clearFeedback" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="your.email@example.com" class="form-input w-full border border-slate-300 p-3 rounded-lg text-sm text-slate-900 transition focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" required />
                    </div>

                    <button type="submit" :disabled="isLoading || Boolean(successMessage)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition shadow-sm mt-4 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2">
                        <i v-if="isLoading" class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
                        <span>{{ isLoading ? 'Sending...' : 'Send Recovery Link' }}</span>
                    </button>
                </form>

                <div class="text-center text-sm font-medium border-t border-slate-100 pt-6">
                    <a href="../index.html" class="text-indigo-600 font-bold hover:text-indigo-800 transition"><i class="fas fa-arrow-left mr-1.5 text-xs" aria-hidden="true"></i>Back to Login</a>
                </div>
            </div>
        </div>

        <div class="w-full md:w-1/2 bg-slate-900 text-white p-8 sm:p-12 md:p-16 relative overflow-hidden flex flex-col justify-center items-center text-center select-none order-1 md:order-2 min-h-[240px] md:min-h-screen">
            <div class="absolute -right-20 -bottom-20 opacity-[0.03] pointer-events-none"><i class="fas fa-city text-[320px]"></i></div>
            <div class="relative z-10 max-w-sm">
                <div class="mb-6 flex justify-center"><img src="../images/logo.svg" alt="Smart Society Logo" class="w-16 h-16 rounded-xl shadow-md bg-white/10 p-1" /></div>
                <h3 class="font-extrabold text-3xl mb-4 leading-snug tracking-tight">Password Recovery</h3>
                <p class="text-slate-400 text-sm leading-relaxed">We'll send secure recovery instructions to your registered email address.</p>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const email = ref('');
                const isLoading = ref(false);
                const errorMessage = ref('');
                const successMessage = ref('');

                const clearFeedback = () => {
                    errorMessage.value = '';
                };

                const handleForgot = async () => {
                    if (isLoading.value) return;

                    errorMessage.value = '';
                    successMessage.value = '';
                    const normalizedEmail = email.value.trim().toLowerCase();

                    if (!normalizedEmail) {
                        errorMessage.value = 'Please enter your email address.';
                        return;
                    }

                    isLoading.value = true;
                    try {
                        await apiCall('/auth/forgot-password', {
                            method: 'POST',
                            body: { email: normalizedEmail },
                            suppressErrorToast: true
                        });

                        successMessage.value = 'Recovery instructions have been sent. Please check your inbox.';
                        setTimeout(() => { window.location.href = '../index.html'; }, 2200);
                    } catch (err) {
                        if (err.status === 404) {
                            errorMessage.value = 'We could not find an account with that email address.';
                        } else if (err.status === 429) {
                            errorMessage.value = 'Too many recovery requests. Please wait a moment and try again.';
                        } else {
                            errorMessage.value = err.message || 'We could not send recovery instructions. Please try again.';
                        }
                    } finally {
                        isLoading.value = false;
                    }
                };

                return { email, isLoading, errorMessage, successMessage, clearFeedback, handleForgot };
            }
        }).mount('#app');
    </script>
</body>
</html>
