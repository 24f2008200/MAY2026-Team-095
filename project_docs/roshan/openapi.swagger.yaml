          type: string
          format: uuid
          title: Escalation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/customer/dashboard:
    get:
      tags:
      - Customer
      summary: Get Dashboard
      operationId: get_dashboard_api_v1_customer_dashboard_get
      responses:
        '200':
